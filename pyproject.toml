[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lethe"
version = "0.1.0"
description = "Agent teams that forget: periodically wipe every agent's memory, restart from the best candidate, and keep discovering."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tatra Labs" }]
keywords = ["llm", "agents", "autoresearch", "alphaevolve", "discovery", "optimization", "claude-code"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
tasks = ["numpy>=1.24"]
dev = ["pytest>=7", "matplotlib>=3.7", "numpy>=1.24"]

[project.scripts]
lethe = "lethe.cli:main"

[project.urls]
Homepage = "https://github.com/tatra-labs/lethe"
Paper = "https://arxiv.org/abs/2610.20563"

[tool.hatch.build.targets.wheel]
packages = ["src/lethe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
